<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yemufist · 我的第一个 GitHub 页面</title>
<style>
  :root {
    --ink: #1f2328;
    --muted: #59636e;
    --line: #d8dee4;
    --bg: #ffffff;
    --soft: #f6f8fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    line-height: 1.75;
    font-size: 16px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 72px;
  }
  .tag {
    display: inline-block;
    font-size: 13px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 12px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 30px;
    line-height: 1.3;
    margin: 0 0 12px;
    letter-spacing: 0.5px;
  }
  .lead {
    color: var(--muted);
    margin: 0 0 32px;
  }
  hr {
    border: 0;
    border-top: 1px solid var(--line);
    margin: 32px 0;
  }
  h2 {
    font-size: 17px;
    margin: 0 0 8px;
  }
  p { margin: 0 0 14px; }
  ul {
    margin: 0;
    padding-left: 22px;
  }
  li { margin-bottom: 8px; }
  code {
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .note {
    background: var(--soft);
    border-left: 3px solid var(--line);
    padding: 14px 16px;
    border-radius: 0 6px 6px 0;
    font-size: 14px;
    color: var(--muted);
    margin-top: 32px;
  }
  footer {
    margin-top: 40px;
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="tag">GitHub Pages 练习</span>
    <h1>这是一张可以访问的页面</h1>
    <p class="lead">如果你在浏览器里看到这段文字，说明仓库已经推送到 GitHub，Pages 也部署成功了。</p>

    <hr>

    <h2>这个页面是怎么来的</h2>
    <p>文件就在仓库根目录的 <code>index.html</code>，没有任何构建步骤，改完提交、推送，一两分钟后线上就更新。</p>

    <h2>接下来可以试试</h2>
    <ul>
      <li>改掉这一行文字，提交时写清改了什么</li>
      <li>新建一条分支做修改，再合并回主分支</li>
      <li>在网页端直接编辑文件，对比两种提交方式的差别</li>
    </ul>

    <div class="note">
      提示：Pages 首次部署需要一到两分钟。如果打开页面显示 404，先等一会儿再刷新，并确认文件名大小写与根目录位置无误。
    </div>

    <footer>yemufist · 2026</footer>
  </div>
</body>
</html>
